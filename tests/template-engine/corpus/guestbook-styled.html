<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>guestbook styled</title>
<style>
.gb { max-width: 560px; margin: 16px auto; padding: 16px; background: #fff0f8 url(https://example.neocities.org/stars.png); border: 4px dotted #f6c; font: 13px "Comic Sans MS", cursive; color: #603; }
.gb h2 { text-align: center; color: #fff; text-shadow: 0 0 6px #f0f; }
.gb .guestbook-section { background: #fff; border-radius: 12px; padding: 12px; }
.gb .guestbook-section textarea { background: #fff8fc; border: 2px dashed #f6c; font: inherit; }
.gb .guestbook-section button { background: #f6c; color: #fff; border: 0; border-radius: 999px; font: inherit; }
.gb .guestbook-section li, .gb .guestbook-section article { border-bottom: 1px dashed #f6c; }
</style>
</head>
<body>
<div class="gb">
  <h2>~ sign my guestbook ~</h2>
  <img src="https://example.neocities.org/blinkie.0.png" alt="">
  <Guestbook heading="none" />
</div>
</body>
</html>
